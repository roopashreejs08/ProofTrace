<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" role="img" aria-labelledby="ttl" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="ttl">The five-agent ProofTrace pipeline, top to bottom: Claim Extractor produces items, Paper Finder produces a PaperMatch per item, Retraction Checker produces a RetractionResult, Evidence Analyst produces an EvidenceResult, and the Verification Agent writes the report and verdicts.</title>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="580" fill="#ffffff"/>

  <!-- input -->
  <rect x="340" y="20" width="300" height="46" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="490" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">input text (paste or PDF)</text>

  <line x1="490" y1="66" x2="490" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 1 Claim Extractor -->
  <rect x="150" y="92" width="680" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="186" cy="130" r="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="186" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">1</text>
  <text x="216" y="124" font-size="14" font-weight="700" fill="#1e293b">Claim Extractor</text>
  <text x="216" y="146" font-size="12" fill="#475569">splits body from bibliography; links in-text citations to references</text>
  <rect x="664" y="116" width="150" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="739" y="135" text-anchor="middle" font-size="11.5" fill="#475569">items</text>

  <line x1="490" y1="168" x2="490" y2="186" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 2 Paper Finder -->
  <rect x="150" y="188" width="680" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="186" cy="226" r="16" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="186" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">2</text>
  <text x="216" y="220" font-size="14" font-weight="700" fill="#1e293b">Paper Finder</text>
  <text x="216" y="242" font-size="12" fill="#475569">DOI or search lookup; title, author and year checks; abstract and full text</text>
  <rect x="664" y="212" width="150" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="739" y="231" text-anchor="middle" font-size="11.5" fill="#475569">PaperMatch</text>

  <line x1="490" y1="264" x2="490" y2="282" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 3 Retraction Checker -->
  <rect x="150" y="284" width="680" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="186" cy="322" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="186" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">3</text>
  <text x="216" y="316" font-size="14" font-weight="700" fill="#1e293b">Retraction Checker</text>
  <text x="216" y="338" font-size="12" fill="#475569">notice checks across four sources; plus the document's own DOI</text>
  <rect x="664" y="308" width="150" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="739" y="327" text-anchor="middle" font-size="11.5" fill="#475569">RetractionResult</text>

  <line x1="490" y1="360" x2="490" y2="378" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 4 Evidence Analyst -->
  <rect x="150" y="380" width="680" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="186" cy="418" r="16" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="186" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">4</text>
  <text x="216" y="412" font-size="14" font-weight="700" fill="#1e293b">Evidence Analyst</text>
  <text x="216" y="434" font-size="12" fill="#475569">reads the full text or abstract and asks Gemini for a stance</text>
  <rect x="664" y="404" width="150" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="739" y="423" text-anchor="middle" font-size="11.5" fill="#475569">EvidenceResult</text>

  <line x1="490" y1="456" x2="490" y2="474" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 5 Verification Agent -->
  <rect x="150" y="476" width="680" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="186" cy="514" r="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="186" y="520" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">5</text>
  <text x="216" y="508" font-size="14" font-weight="700" fill="#1e293b">Verification Agent</text>
  <text x="216" y="530" font-size="12" fill="#475569">applies the verdict rules and writes the report</text>
  <rect x="664" y="500" width="150" height="28" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="739" y="519" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4338ca">report + verdicts</text>
</svg>
