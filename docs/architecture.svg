<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" role="img" aria-labelledby="ttl" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="ttl">ProofTrace request flow: the browser talks to FastAPI, which runs the five-agent pipeline in the background; the pipeline reads and writes the SQLite blackboard and calls external scholarly services.</title>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="580" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="290" y="24" width="400" height="86" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="490" y="53" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Browser (React)</text>
  <text x="490" y="77" text-anchor="middle" font-size="12.5" fill="#4338ca">paste text / upload PDF  &#8594;  POST /api/investigations</text>
  <text x="490" y="97" text-anchor="middle" font-size="12.5" fill="#4338ca">poll every 1s  &#8594;  GET /api/investigations/{id}</text>

  <line x1="490" y1="110" x2="490" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
  <text x="502" y="133" font-size="11.5" fill="#64748b">id returned immediately; pipeline runs in the background</text>

  <!-- FastAPI -->
  <rect x="290" y="150" width="400" height="56" rx="12" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="490" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">FastAPI</text>
  <text x="490" y="194" text-anchor="middle" font-size="11.5" fill="#4338ca">creates the investigation, then runs the pipeline as a background task</text>

  <line x1="490" y1="206" x2="490" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Pipeline -->
  <rect x="30" y="244" width="920" height="188" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="52" y="272" font-size="13" font-weight="700" fill="#334155">Pipeline</text>
  <text x="52" y="290" font-size="11.5" fill="#64748b">each agent reads the investigation, calls the external APIs, then writes its finding and progress back to SQLite</text>

  <!-- agent pills -->
  <rect x="54" y="306" width="152" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="130" y="337" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Claim Extractor</text>
  <text x="130" y="356" text-anchor="middle" font-size="10.5" fill="#64748b">parses citations</text>

  <rect x="234" y="306" width="152" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="310" y="337" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Paper Finder</text>
  <text x="310" y="356" text-anchor="middle" font-size="10.5" fill="#64748b">finds papers</text>

  <rect x="414" y="306" width="152" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="490" y="337" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Retraction Checker</text>
  <text x="490" y="356" text-anchor="middle" font-size="10.5" fill="#64748b">checks notices</text>

  <rect x="594" y="306" width="152" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="670" y="337" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Evidence Analyst</text>
  <text x="670" y="356" text-anchor="middle" font-size="10.5" fill="#64748b">reads evidence</text>

  <rect x="774" y="306" width="152" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="850" y="337" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Verification Agent</text>
  <text x="850" y="356" text-anchor="middle" font-size="10.5" fill="#64748b">writes verdicts</text>

  <!-- arrows between pills -->
  <line x1="206" y1="342" x2="234" y2="342" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="386" y1="342" x2="414" y2="342" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="566" y1="342" x2="594" y2="342" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="746" y1="342" x2="774" y2="342" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>

  <text x="490" y="412" text-anchor="middle" font-size="11.5" fill="#64748b">a failure in one stage degrades the report instead of aborting the run</text>

  <!-- arrows to stores -->
  <line x1="270" y1="432" x2="270" y2="466" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="710" y1="432" x2="710" y2="466" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- SQLite -->
  <rect x="100" y="470" width="340" height="84" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="270" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">SQLite blackboard</text>
  <text x="270" y="518" text-anchor="middle" font-size="11" fill="#64748b">investigations &#183; items &#183; findings</text>
  <text x="270" y="536" text-anchor="middle" font-size="11" fill="#64748b">agent_runs &#183; api_log &#183; http_cache</text>

  <!-- External services -->
  <rect x="540" y="470" width="340" height="84" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="710" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">External services</text>
  <text x="710" y="518" text-anchor="middle" font-size="11" fill="#b45309">Crossref &#183; OpenAlex &#183; Europe PMC</text>
  <text x="710" y="536" text-anchor="middle" font-size="11" fill="#b45309">PubMed &#183; Gemini (optional)</text>
</svg>
